server:
  port: 8081

spring:
  datasource:
    # Own in-memory database: no other service can read these tables
    url: jdbc:h2:mem:catalogdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
